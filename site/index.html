<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>Doughnate – Endometriózis játék</title>
<link rel="stylesheet" href="vendor/fonts/betuk.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- KEZDŐKÉPERNYŐ -->
  <section id="kepernyo-vonzo" class="kepernyo aktiv" aria-label="Kezdőképernyő">
    <button id="diag-sarok" class="diag-sarok" aria-hidden="true" tabindex="-1"></button>
    <div class="vonzo-felso">
      <div class="fejlec logo-sor" id="vonzo-logok"><!-- logók: config.js → marka.logok --></div>
      <button class="kis-vissza hirlevel-nyit" id="hirlevel-nyit-vonzo" type="button"><span aria-hidden="true">✉</span> <span class="felirat"></span></button>
    </div>
    <div class="vonzo-tartalom">
      <div class="vonzo-hero">
        <div class="cimke" id="vonzo-cimke"></div>
        <h1 id="vonzo-cim" class="vonzo-cim"></h1>
        <p class="vonzo-alcim" id="vonzo-alcim"></p>
      </div>
      <div class="pakli vonzo-pakli" aria-live="polite">
        <div class="pakli-hat"></div>
        <div class="teny-pakli" id="teny-pakli"><!-- a forgó tények kártyái (js/app.js) --></div>
      </div>
    </div>
    <div class="ives-sav">
      <div class="ives-sav-belso">
        <span class="gomb-forma gomb-sarga pulzal" id="vonzo-felhivas"></span>
        <span class="meta" id="vonzo-meta"></span>
      </div>
      <div class="rendezveny" id="rendezveny-nev"></div>
    </div>
  </section>

  <!-- JÁTÉK -->
  <section id="kepernyo-jatek" class="kepernyo" aria-label="Játék">
    <div class="jatek-fejlec">
      <!-- logó = kezdőképernyő (Home) gomb; a kép a config.js → marka.jatekLogo -->
      <button class="home-logo" id="home-logo" type="button" aria-label="Vissza a kezdőképernyőre"><img alt="" draggable="false"></button>
      <div class="haladas" id="haladas" aria-hidden="true"></div>
      <button class="kis-vissza" id="kis-vissza" type="button"><span aria-hidden="true">←</span> Vissza a kezdőképernyőre</button>
    </div>
    <div class="jatek-ter pakli" id="jatek-ter-kulso">
      <div class="pakli-hat"></div>
      <div class="jatek-kartyahely" id="jatek-ter"><!-- ide kerül a kártya vagy a csúszka --></div>
    </div>
    <div class="valasz-gombok" id="valasz-gombok">
      <button class="nagy-gomb gomb-bal" id="gomb-bal"></button>
      <button class="nagy-gomb gomb-jobb" id="gomb-jobb"></button>
    </div>
    <!-- Magyarázat -->
    <div class="magyarazat" id="magyarazat" hidden>
      <div class="magyarazat-belso">
        <div class="visszajelzes-sor">
          <span class="visszajelzes-ikon" id="visszajelzes-ikon" aria-hidden="true"></span>
          <div class="visszajelzes" id="visszajelzes"></div>
        </div>
        <p class="helyes-valasz" id="helyes-valasz"></p>
        <p class="magyarazat-szoveg" id="magyarazat-szoveg"></p>
        <p class="orvos-lablec" id="orvos-lablec" hidden></p>
        <p class="forras" id="forras"></p>
        <button class="tovabb gomb-forma gomb-sarga" id="tovabb" aria-label="Tovább">
          <span class="tovabb-szoveg">Tovább →</span>
          <span class="idosav"><span class="idosav-toltes" id="idosav-toltes"></span></span>
        </button>
      </div>
    </div>
  </section>

  <!-- ZÁRÓKÉPERNYŐ -->
  <section id="kepernyo-zaro" class="kepernyo" aria-label="Záróképernyő">
    <div class="cimke" id="zaro-cimke"></div>
    <h1 class="zaro-cim" id="zaro-cim"></h1>
    <p class="zaro-szoveg" id="zaro-szoveg"></p>
    <div class="qr-racs" id="qr-racs"></div>
    <div class="zaro-gombok">
      <button class="nagy-gomb gomb-sarga" id="gomb-uj-kor"></button>
      <button class="nagy-gomb gomb-keret hirlevel-nyit" id="hirlevel-nyit-zaro" type="button"><span aria-hidden="true">✉</span> <span class="felirat"></span></button>
    </div>
    <div class="logo-sav logo-sor" id="zaro-logok"></div>
    <p class="jogi" id="jogi-zaro"></p>
  </section>

  <!-- HÍRLEVÉL-FELIRATKOZÁS (a kezdő- és a záróképernyőről nyílik; az adatok az Apps Scripttel a táblázat „Feliratkozok” fülére kerülnek) -->
  <section id="kepernyo-hirlevel" class="kepernyo" aria-label="Hírlevél-feliratkozás">
    <div class="hirlevel-belso">
      <div class="hirlevel-fej">
        <div class="cimke" id="hirlevel-cimke"></div>
        <h1 class="hirlevel-cim" id="hirlevel-cim"></h1>
        <p class="hirlevel-szoveg" id="hirlevel-szoveg"></p>
      </div>
      <form class="hirlevel-urlap" id="hirlevel-urlap" novalidate autocomplete="off">
        <label class="mezo">
          <span class="mezo-cimke" id="hirlevel-email-cimke"></span>
          <input type="email" id="hirlevel-email" name="email" inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="254" required>
        </label>
        <label class="mezo">
          <span class="mezo-cimke" id="hirlevel-nev-cimke"></span>
          <input type="text" id="hirlevel-nev" name="nev" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="120">
        </label>
        <label class="hozzajarulas">
          <input type="checkbox" id="hirlevel-hozzajarulas">
          <span class="pipa-doboz" aria-hidden="true"></span>
          <span id="hirlevel-hozzajarulas-szoveg"></span>
        </label>
        <p class="hirlevel-hiba" id="hirlevel-hiba" role="alert" hidden></p>
        <div class="hirlevel-gombok">
          <button type="submit" class="nagy-gomb gomb-sarga" id="hirlevel-kuld"></button>
          <button type="button" class="kis-vissza" id="hirlevel-megse"></button>
        </div>
        <p class="hirlevel-adatkezeles" id="hirlevel-adatkezeles"></p>
      </form>
      <div class="hirlevel-koszonet" id="hirlevel-koszonet" hidden>
        <span class="visszajelzes-ikon jo" aria-hidden="true"></span>
        <h1 class="hirlevel-cim" id="hirlevel-koszonet-cim"></h1>
        <p class="hirlevel-szoveg" id="hirlevel-koszonet-szoveg"></p>
      </div>
    </div>
  </section>

  <!-- TÉTLENSÉG -->
  <div class="tetlen" id="tetlen" hidden>
    <div class="tetlen-doboz">
      <div class="tetlen-kerdes" id="tetlen-kerdes"></div>
      <div class="tetlen-szamlalo" id="tetlen-szamlalo"></div>
      <button class="nagy-gomb gomb-sarga" id="tetlen-gomb"></button>
    </div>
  </div>

  <!-- DIAGNOSZTIKA (rejtett) -->
  <div class="diag" id="diag" hidden>
    <pre id="diag-szoveg"></pre>
    <div class="diag-gombok">
      <button id="diag-frissit">Tartalom frissítése most</button>
      <button id="diag-kuld">Statisztika küldése most</button>
      <button id="diag-bezar">Bezárás</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="content/alap_tartalom.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/csv.js"></script>
<script src="js/tartalom.js"></script>
<script src="js/statisztika.js"></script>
<script src="js/app.js"></script>
</body>
</html>
